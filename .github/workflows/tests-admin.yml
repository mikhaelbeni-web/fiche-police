# Tests de l'espace admin (onglet Codes d'accès > Espace admin) :
# tests unitaires Node, build Next.js réel, puis contrôles de bout en bout
# simulant un réceptionniste (code d'accès seul) contre l'application lancée.
name: Tests espace admin
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["claude/**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-qa
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-qa.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1:web:1"
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: secret-de-ci-uniquement
      ADMIN_PASSWORD: mot-de-passe-de-ci-uniquement
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install --no-audit --no-fund
      - name: Tests unitaires
        run: node --import ./tests/loader.mjs --test 'tests/*.test.mjs'
      - run: npm run build
      - name: Contrôles de bout en bout
        run: |
          export ADMIN_PASSWORD_HASH="$(node -e "const c=require('crypto');const s=c.randomBytes(16);const h=c.pbkdf2Sync(process.env.ADMIN_PASSWORD,s,600000,32,'sha256');console.log('pbkdf2\$sha256\$600000\$'+s.toString('base64')+'\$'+h.toString('base64'))")"
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          BASE_URL=http://127.0.0.1:3000 node tests/e2e-admin.mjs || { cat next.log; exit 1; }
