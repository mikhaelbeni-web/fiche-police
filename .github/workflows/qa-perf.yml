# Mesure temporaire du temps de chargement (avant/après) — à retirer avant fusion.
name: Mesure chargement
on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-4mq6ng"]
    paths: ["pages/**", "components/**", "lib/**", "qa-perf/**", ".github/workflows/qa-perf.yml"]
jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: perf-secret
      RUNS: "5"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Config Firebase publique (lue dans le code déployé)
        run: |
          H=https://fiche-police.vercel.app
          BID=$(curl -s $H/ | grep -o '/_next/static/[^/]*/_buildManifest.js' | head -1)
          mkdir -p /tmp/prod; curl -s $H$BID -o /tmp/prod/manifest.js
          for c in $(grep -o 'static/chunks/[^"]*\.js' /tmp/prod/manifest.js | sort -u); do curl -s "$H/_next/$c" >> /tmp/prod/all.js; done
          for c in $(curl -s $H/commande-linge | grep -o '/_next/static/chunks/[^"]*\.js'); do curl -s "$H$c" >> /tmp/prod/all.js; done
          KEY=$(grep -o 'AIza[0-9A-Za-z_-]\{35\}' /tmp/prod/all.js | head -1)
          APPID=$(grep -o '1:[0-9]\+:web:[0-9a-f]\+' /tmp/prod/all.js | head -1)
          echo "clé trouvée: ${KEY:+oui} appId: ${APPID:+oui}"
          {
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=$KEY"
            echo "NEXT_PUBLIC_FIREBASE_APP_ID=$APPID"
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=beylev-linge"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=beylev-linge.firebaseapp.com"
          } >> $GITHUB_ENV
          echo "--- Production : poids compressé (br) des scripts au 1er affichage ---"
          for p in /commande-linge /transition; do
            tot=0; for c in $(curl -s $H$p | grep -o '/_next/static/chunks/[^"]*\.js'); do
              n=$(curl -s -H 'Accept-Encoding: br' "$H$c" | wc -c); tot=$((tot+n)); echo "$p $c $n"; done; echo "$p TOTAL $tot"; done
          echo "--- Production : latence /api/auth ---"
          for i in 1 2 3; do curl -s -o /dev/null -w "%{time_total}\n" $H/api/auth; done
      - name: Build avant (main) et après (branche)
        run: |
          git worktree add /tmp/avant origin/main
          npm ci
          (cd /tmp/avant && npm ci --silent && npm run build 2>&1 | sed -n '/Route (pages)/,$p' | sed 's/^/AVANT /')
          npm run build 2>&1 | sed -n '/Route (pages)/,$p' | sed 's/^/APRES /'
      - name: Démarrer les deux versions
        run: |
          (cd /tmp/avant && npx next start -p 3001 > /tmp/avant.log 2>&1 &)
          (npx next start -p 3002 > /tmp/apres.log 2>&1 &)
          for i in $(seq 1 60); do curl -s 127.0.0.1:3001/api/auth >/dev/null && curl -s 127.0.0.1:3002/api/auth >/dev/null && break; sleep 1; done
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium webkit
      - name: Réseau type 4G (latence 150 ms aller-retour, 5 Mbit/s)
        run: |
          IF=$(ip route | awk '/default/ {print $5; exit}')
          sudo tc qdisc add dev lo root netem delay 75ms rate 5mbit
          sudo tc qdisc add dev $IF root netem delay 70ms
          ping -c 2 127.0.0.1 | tail -1
      - name: Mesures
        run: node qa-perf/perf.mjs
