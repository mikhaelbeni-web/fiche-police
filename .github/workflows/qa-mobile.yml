# Audit smartphone (qa-mobile/) : build réel + émulateur Firestore avec données
# fictives + captures Playwright à 360, 390, 430 px et en paysage.
# Lancement manuel (Actions > Audit mobile > Run workflow) ou à chaque push sur
# une branche qa-mobile/** ou claude/**.
name: Audit mobile
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages à auditer (vide = toutes), ex. « sinistres taxes »"
        required: false
        default: ""
  push:
    branches: ["claude/project-thread-vpwis4"]
    paths: ["pages/**", "components/**", "styles/**", "lib/**", "qa-mobile/**", ".github/workflows/qa-mobile.yml"]

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-qa
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-qa.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1:web:1"
      NEXT_PUBLIC_FIRESTORE_EMULATOR: 127.0.0.1:8080
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm install --no-save playwright@1.48.2 firebase-tools@13
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Démarrer l'émulateur Firestore et l'app
        run: |
          (cd qa-mobile && npx firebase-tools emulators:start --only firestore --project demo-qa > ../emu.log 2>&1 &)
          (npx next start -p 3000 > next.log 2>&1 &)
          for i in $(seq 1 60); do curl -s 127.0.0.1:8080 >/dev/null && curl -s 127.0.0.1:3000/api/auth >/dev/null && break; sleep 2; done
          tail -5 emu.log
      - name: Audit
        run: node qa-mobile/audit.mjs ${{ github.event.inputs.pages }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-mobile
          path: |
            qa-mobile/out
            emu.log
            next.log
          retention-days: 7
